
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Pengunjung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="index.html">Jelajah Sulbar</a>
        <a class="btn btn-light" href="index.html">Beranda</a>
    </div>
</nav>

<main class="container py-5">
    <div class="card login-card mx-auto">
        <div class="card-body p-4">
            <h1 class="text-center mb-3">Login Pengunjung</h1>
            <p class="text-center">Masukkan data untuk mencoba validasi formulir.</p>

            <div id="alertBox" class="alert d-none" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Alamat Email</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="nama@email.com">
                    <small id="emailError" class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Minimal 8 karakter">
                    <small id="passwordError" class="text-danger"></small>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Login
                </button>
            </form>
        </div>
    </div>
</main>

<footer class="text-center p-3">
    <p>&copy; 2026 Jelajah Sulbar</p>
</footer>

<script src="./script.js" defer></script>
</body>
</html>

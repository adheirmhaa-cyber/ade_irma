
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Profil Mahasiswa</a>
        <a class="btn btn-light" href="index.html">Beranda</a>
    </div>
</nav>

<main class="container py-5">
    <div class="card mx-auto login-card">
        <div class="card-body p-4">
            <h1 class="text-center mb-4">Login Mahasiswa</h1>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" class="form-control"
                           placeholder="Masukkan email">
                    <small id="emailError" class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control"
                           placeholder="Masukkan password">
                    <small id="passwordError" class="text-danger"></small>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Login
                </button>
                <p id="pesan" class="mt-3 text-center"></p>
            </form>
        </div>
    </div>
</main>

<footer class="text-center p-3">
    <p>&copy; 2026 Website Profil Mahasiswa</p>
</footer>

<script src="script.js"></script>
</body>
</html>
